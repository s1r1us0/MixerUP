<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#040609" />
    <title>MixerUp iOS — CyberStudio DAW</title>
    
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    
    <link rel="stylesheet" href="ios_style.css?v=3000" />
  </head>
  <body>
    <div class="ios-app-container">
      
      <!-- Navbar Header -->
      <header class="app-header">
        <div class="logo-box">
          <img src="logo.png" alt="MixerUp" class="app-logo" />
          <span class="app-title">MixerUp</span>
          <span class="app-badge">Cyber Studio</span>
        </div>
        
        <select id="deviceSelect" class="server-selector">
          <option value="offline" selected>📱 Cihaz İçi Offline Mod (WebAssembly)</option>
          <option value="auto">⚡ Otomatik (Sunucu GPU/CPU)</option>
          <option value="cuda">🚀 Ekran Kartı GPU</option>
          <option value="cpu">💻 İşlemci CPU</option>
        </select>
      </header>

      <!-- Upload Hero Card -->
      <section id="uploadSection" class="glass-box">
        <div class="hero-upload">
          <div class="upload-icon-circle">🎵</div>
          <h2 class="upload-main-title">Ses veya Video Dosyası Seçin</h2>
          <p class="upload-sub-text">MP3, WAV, M4A, FLAC • MP4, MOV Video Desteği</p>
          
          <label for="songFile" class="btn-open-files">
            📁 Dosyalardan Şarkı Seçin
          </label>
          <input id="songFile" type="file" style="position:absolute;opacity:0;width:1px;height:1px;left:-9999px;" />
          
          <div id="progressWrap" class="progress-bar-wrap" hidden>
            <div class="progress-header">
              <span id="progressText">Hazırlanıyor…</span>
              <span id="progressValue">0%</span>
            </div>
            <div class="progress-bar-track">
              <div id="progressBar" class="progress-bar-fill"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- Master Waveform Canvas & Time Display -->
      <section id="waveformSection" class="glass-box" hidden>
        <div class="master-waveform-box">
          <div class="track-meta-row">
            <span id="songNameDisplay" class="song-name-display">Şarkı Yüklenmedi</span>
            <span id="timecodeDisplay" class="timecode-display">00:00 / 00:00</span>
          </div>
          
          <div class="waveform-canvas-box">
            <canvas id="masterCanvas"></canvas>
          </div>
          
          <!-- Sound Presets -->
          <div class="preset-chips-row">
            <button class="chip-btn active" data-preset="reset">⚡ Full Mix</button>
            <button class="chip-btn" data-preset="karaoke">🎤 Karaoke (Vokalsiz)</button>
            <button class="chip-btn" data-preset="acapella">🗣️ Acapella (Solo Vokal)</button>
            <button class="chip-btn" data-preset="drumless">🥁 Drumless (Davulsuz)</button>
            <button class="chip-btn" data-preset="bassless">🎸 Bassless (Bassız)</button>
          </div>
        </div>
      </section>

      <!-- Multi-Track DAW Stem Lanes -->
      <section id="mixerSection" class="glass-box" hidden>
        <div class="daw-lanes-container">
          
          <!-- Vocal Lane -->
          <div class="stem-lane-card" data-stem="vocal">
            <div class="lane-header">
              <div class="lane-identity">
                <div class="lane-icon">🎤</div>
                <span class="lane-title">Vokal Kanalı</span>
              </div>
              <span id="vocalVolPct" class="lane-vol-pct">100%</span>
            </div>
            <div class="lane-controls">
              <button id="btnMuteVocal" class="btn-toggle-pad">Mute</button>
              <button id="btnSoloVocal" class="btn-toggle-pad">Solo</button>
              <div class="slider-wrapper">
                <input id="faderVocal" type="range" class="stem-slider" min="0" max="1.5" step="0.01" value="1" />
                <div class="peak-bar-box"><div id="peakVocal" class="peak-bar-level"></div></div>
              </div>
            </div>
          </div>

          <!-- Drums Lane -->
          <div class="stem-lane-card" data-stem="drums">
            <div class="lane-header">
              <div class="lane-identity">
                <div class="lane-icon">🥁</div>
                <span class="lane-title">Davul Kanalı</span>
              </div>
              <span id="drumsVolPct" class="lane-vol-pct">100%</span>
            </div>
            <div class="lane-controls">
              <button id="btnMuteDrums" class="btn-toggle-pad">Mute</button>
              <button id="btnSoloDrums" class="btn-toggle-pad">Solo</button>
              <div class="slider-wrapper">
                <input id="faderDrums" type="range" class="stem-slider" min="0" max="1.5" step="0.01" value="1" />
                <div class="peak-bar-box"><div id="peakDrums" class="peak-bar-level"></div></div>
              </div>
            </div>
          </div>

          <!-- Bass Lane -->
          <div class="stem-lane-card" data-stem="bass">
            <div class="lane-header">
              <div class="lane-identity">
                <div class="lane-icon">🎸</div>
                <span class="lane-title">Bas Kanalı</span>
              </div>
              <span id="bassVolPct" class="lane-vol-pct">100%</span>
            </div>
            <div class="lane-controls">
              <button id="btnMuteBass" class="btn-toggle-pad">Mute</button>
              <button id="btnSoloBass" class="btn-toggle-pad">Solo</button>
              <div class="slider-wrapper">
                <input id="faderBass" type="range" class="stem-slider" min="0" max="1.5" step="0.01" value="1" />
                <div class="peak-bar-box"><div id="peakBass" class="peak-bar-level"></div></div>
              </div>
            </div>
          </div>

          <!-- Other Lane -->
          <div class="stem-lane-card" data-stem="other">
            <div class="lane-header">
              <div class="lane-identity">
                <div class="lane-icon">🎹</div>
                <span class="lane-title">Diğer / Enstrüman</span>
              </div>
              <span id="otherVolPct" class="lane-vol-pct">100%</span>
            </div>
            <div class="lane-controls">
              <button id="btnMuteOther" class="btn-toggle-pad">Mute</button>
              <button id="btnSoloOther" class="btn-toggle-pad">Solo</button>
              <div class="slider-wrapper">
                <input id="faderOther" type="range" class="stem-slider" min="0" max="1.5" step="0.01" value="1" />
                <div class="peak-bar-box"><div id="peakOther" class="peak-bar-level"></div></div>
              </div>
            </div>
          </div>

        </div>
      </section>

      <!-- DSP Transpose Controls -->
      <section id="dspSection" class="glass-box" hidden>
        <div class="dsp-controls-row">
          <div class="dsp-box">
            <div class="dsp-title-row">
              <span>🎵 Transpoze (Pitch)</span>
              <span id="pitchLabel">0 st</span>
            </div>
            <input id="pitchSlider" type="range" class="stem-slider" min="-12" max="12" step="1" value="0" />
          </div>

          <div class="dsp-box">
            <div class="dsp-title-row">
              <span>⚡ Oynatma Hızı</span>
              <span id="tempoLabel">1.0x</span>
            </div>
            <input id="tempoSlider" type="range" class="stem-slider" min="0.5" max="2.0" step="0.05" value="1" />
          </div>
        </div>
      </section>

    </div>

    <!-- Floating Media Dock -->
    <div id="floatingDock" class="floating-media-dock" hidden>
      <button id="btnMasterToggle" class="btn-master-toggle">▶</button>
      <div class="dock-buttons">
        <button id="btnExportMix" class="btn-download-action">📥 Miksi İndir</button>
        <button id="btnExportZip" class="btn-download-action">📦 Kanalları İndir (ZIP)</button>
      </div>
    </div>

    <!-- HTML5 Audio Elements -->
    <audio id="vocalAudio"></audio>
    <audio id="drumsAudio"></audio>
    <audio id="bassAudio"></audio>
    <audio id="otherAudio"></audio>

    <script src="ios_app.js?v=3000"></script>
  </body>
</html>
