name: Build MixerUp iOS IPA

on:
  push:
    branches: [ main, master, ana, "*" ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Native iOS App Binary
        run: |
          mkdir -p build/App.app
          mkdir -p build/App.app/www
          
          # Copy Web App Files
          cp index.html style.css app.js manifest.json logo.png apple-touch-icon.png icon-192.png icon-512.png build/App.app/www/ 2>/dev/null || true

          # Create Info.plist
          cat << 'EOF' > build/App.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>MixerUp</string>
              <key>CFBundleIdentifier</key>
              <string>com.mixerup.app</string>
              <key>CFBundleName</key>
              <string>MixerUp</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>2.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>UIRequiresFullScreen</key>
              <true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

          # Create Swift Main Executable Code
          cat << 'EOF' > main.swift
          import UIKit
          import WebKit

          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  let vc = UIViewController()
                  let webView = WKWebView(frame: vc.view.bounds)
                  webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  
                  if let wwwUrl = Bundle.main.url(forResource: "index", withExtension: "html", subdirectory: "www") {
                      webView.loadFileURL(wwwUrl, allowingReadAccessTo: wwwUrl.deletingLastPathComponent())
                  }
                  vc.view.addSubview(webView)
                  window?.rootViewController = vc
                  window?.makeKeyAndVisible()
                  return true
              }
          }

          UIApplicationMain(
              CommandLine.argc,
              CommandLine.unsafeArgv,
              nil,
              NSStringFromClass(AppDelegate.self)
          )
          EOF

          # Compile Swift Code to Native iOS Binary
          xcrun -sdk iphoneos swiftc main.swift \
            -target arm64-apple-ios13.0 \
            -emit-executable \
            -o build/App.app/MixerUp

          # Package into Payload/MixerUp.ipa
          mkdir -p Payload
          cp -r build/App.app Payload/
          zip -r MixerUp.ipa Payload

      - name: Upload MixerUp.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MixerUp-iOS-IPA
          path: MixerUp.ipa
